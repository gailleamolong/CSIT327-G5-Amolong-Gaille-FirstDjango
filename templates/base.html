<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #198754;
            --bs-primary-rgb: 25, 135, 84;
            --bs-link-color: #146c43;
            --bs-link-hover-color: #0f5132;
            --bs-focus-ring-color: rgba(25, 135, 84, 0.25);
        }

        .btn-primary {
            --bs-btn-bg: #198754;
            --bs-btn-border-color: #198754;
            --bs-btn-hover-bg: #157347;
            --bs-btn-hover-border-color: #146c43;
            --bs-btn-active-bg: #146c43;
            --bs-btn-active-border-color: #13653f;
        }

        .btn-outline-primary {
            --bs-btn-color: #146c43;
            --bs-btn-border-color: #198754;
            --bs-btn-hover-bg: #198754;
            --bs-btn-hover-border-color: #198754;
            --bs-btn-active-bg: #146c43;
            --bs-btn-active-border-color: #146c43;
        }

        .form-control:focus {
            border-color: #75b798;
            box-shadow: 0 0 0 0.25rem var(--bs-focus-ring-color);
        }
    </style>
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}">CampusConnect</a>
        {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3 ms-auto">
                <span class="text-white">Hi, {{ user.username }}!</span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
                </form>
            </div>
        {% else %}
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
                <a class="btn btn-light btn-sm text-primary" href="{% url 'signup' %}">Sign up</a>
            </div>
        {% endif %}
        </div>
    </nav>
    <main class="container py-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
